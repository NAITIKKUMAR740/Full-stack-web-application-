<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBOX</title>
    <style>
        .container{
            border: 4px solid black;
            width: 80vw;
            height: 70vh;
           
            /* height: 70vh; */
            padding: 6px;
            display: flex;
            justify-content: space-evenly ;
            align-items: center;


        }
        .box{
            width:74px;
            height: 25px;
            border: 2px solid green;
            padding: 6px;
            flex-wrap: wrap;
            margin: 14px;
            flex-grow: 1;
        }
        /* #box1{
            align-self: flex-end;
        } */
    </style>
</head>
<body>
    
    <div class="container">
        <div class="box">
            box 1

        </div>
        <div class="box" id="box1">
            box 2

        </div>
        <div class="box">
            box 3

        </div>
        <div class="box">
            box 4

        </div>
        <div class="box">
            box 5

        </div>
    </div>
</body>
</html>
