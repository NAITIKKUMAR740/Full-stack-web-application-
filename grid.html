<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        .container {
            border: 4px solid black;
           
          



            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-columns: 200px  1fr;
            gap: 54px;



        }

        .box {
            
            border: 2px solid green;
          

        }

        /* #box1{
            align-self: flex-end;
        } */
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            box 1

        </div>
        <div class="box" id="box1">
            box 2

        </div>
        <div class="box">
            box 3

        </div>
        <div class="box">
            box 4

        </div>
        <div class="box">
            box 5

        </div>
        <div class="box">
            box 6

        </div>
    </div>
</body>

</html>
