<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>innerHTML and value</title>

</head>
<body>
    <div class="container">
        <div id="welcome"> welcome to my form</div>
        <form action="">
            <input type="text" id="name" value="naitik">
            <input type="submit" value="submit">
        </form>
    </div>
    <script>
        const welcomee=document.getElementById("welcome")
         console.log(welcomee)
         welcome.innerHTML="<h1> hello sir </h1>"  
         welcome.textContent=" hello sirr " 

         const input=document.getElementById("name")
         input.value="nakull is a good boy"

         console.log(input.value)
         welcomee.style.backgroundColor="RED   "

    </script>
    
</body>
</html>
