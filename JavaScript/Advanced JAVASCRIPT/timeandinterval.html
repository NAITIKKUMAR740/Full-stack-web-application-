<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>set time and interval</title>
</head>
<body>
    <script>
        let i=0;

        setInterval(() => {
            console.log("i am the best" +i)
            i++;
            
        }, 1000);

        setTimeout(() => {
            console.log("good one")
        }, 500);
    </script>
    
</body>
</html>
